name: kaizen
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.9.0 <4.0.0' # Using your specified SDK version

dependencies:
  flutter:
    sdk: flutter
  
  # Core Flutter UI
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^2.32.0
  firebase_auth: ^4.20.0
  cloud_firestore: ^4.17.4
  google_sign_in: ^6.2.1

  # State Management
  provider: ^6.1.5+1

  # UI & Utilities
  google_fonts: ^6.3.2
  fl_chart: ^1.1.1
  intl: ^0.20.2 
  random_string: ^2.3.1

  # Local Storage
  shared_preferences: ^2.5.3

  # Hardware & Networking
  http: ^1.6.0
  connectivity_plus: ^7.0.0
  network_info_plus: ^7.0.0
  esp_smartconfig: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true